[build]
  publish = "."

# Netlify-specific domain canonicalization & clean URL rewrites (ignored by Cloudflare Pages, used by Netlify)
[[redirects]]
  from = "http://u4ushub.netlify.app/*"
  to = "https://www.u4ushub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://u4ushub.netlify.app/*"
  to = "https://www.u4ushub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://u4ushub.com/*"
  to = "https://www.u4ushub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://u4ushub.com/*"
